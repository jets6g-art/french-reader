spring.application.name=french-reader
server.port=8080
# Surface the reason in error bodies (bad URL, upstream failure) — personal tool, no secrets in messages.
server.error.include-message=always

# Anthropic API key for POST /api/v1/lookup. Without it the server still starts and serves
# articles; lookups answer 503 until the key is set.
anthropic.api-key=${ANTHROPIC_API_KEY:}
