spring.application.name=french-reader
server.port=8080
# Surface the reason in error bodies (bad URL, upstream failure) — personal tool, no secrets in messages.
server.error.include-message=always

# The Claude API key for POST /api/v1/lookup is read from the CLAUDE_API_ONLY_KEY environment
# variable (see ClaudeLookupService). Without it the server still starts and serves articles;
# lookups answer 503 until it is set.

# Caches (survive restarts). Lookups are keyed on the word's surface form; articles on their URL.
reader.cache.dir=data/cache
reader.cache.max-lookups=5000
reader.cache.max-articles=100
# A cached article older than this is re-fetched; if the source is down the old copy is still served.
reader.cache.article-ttl=PT24H

# The saved word list (user data, kept apart from the deletable cache directory).
reader.saved.file=data/saved/words.json
