<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>French Reader</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form id="load-form">
    <input id="url" type="url" required inputmode="url" autocomplete="off"
           placeholder="https://… (article en français)" aria-label="Article URL">
    <button type="submit">Read</button>
    <button id="paste-toggle" class="secondary" type="button" aria-expanded="false"
            aria-controls="text-form">Paste</button>
    <a id="saved-link" href="saved.html">Saved</a>
  </form>
  <form id="text-form" hidden>
    <textarea id="article-text" rows="10" required lang="fr" spellcheck="false"
              placeholder="Collez le texte de l'article ici. Une première ligne courte sert de titre."
              aria-label="Article text"></textarea>
    <div class="text-actions">
      <button type="submit">Read text</button>
      <button id="text-cancel" class="secondary" type="button">Cancel</button>
    </div>
  </form>
  <p id="status" role="status" hidden></p>
  <main id="article"></main>
  <aside id="popup" hidden aria-live="polite">
    <button id="popup-close" type="button" aria-label="Close">×</button>
    <div id="popup-body"></div>
  </aside>
  <script type="module" src="app.js"></script>
</body>
</html>
